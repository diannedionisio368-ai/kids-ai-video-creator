<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kids AI Video Creator</title>
<style>
:root{--p:#5b61ff;--bg:#f5f7ff;--ink:#172033;--muted:#68738a;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef0ff,#fff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:22px}.hero{text-align:center;padding:24px 8px}.hero h1{font-size:clamp(28px,7vw,48px);margin:0 0 8px}.hero p{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid #e3e7f2;border-radius:24px;padding:20px;box-shadow:0 10px 30px #1b25501a;margin:16px 0}
label{display:block;font-weight:700;margin:15px 0 8px}textarea,select,input{width:100%;font:inherit;border:1px solid #d6dbea;border-radius:14px;padding:14px;background:#fff}textarea{min-height:130px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.btn{width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:800;background:var(--p);color:#fff;margin-top:18px;cursor:pointer}.btn:disabled{opacity:.55}
.status{margin-top:15px;color:var(--muted);min-height:24px}.bar{height:10px;background:#e7eaf7;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:var(--p);transition:width .3s}.videoBox{background:#101827;border-radius:18px;padding:10px;text-align:center}.videoBox video{width:min(100%,420px);max-height:70vh;border-radius:12px}.download{display:inline-block;margin-top:12px;background:#172033;color:#fff;padding:12px 16px;border-radius:12px;text-decoration:none;font-weight:700}.small{font-size:13px;color:var(--muted)}.diag{font-family:ui-monospace,monospace;background:#f7f8fc;border-radius:12px;padding:12px;white-space:pre-wrap}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><h1>✨ Kids AI Video Creator</h1><p>Prompt → AI lesson → real animated video → narration → captions → MP4</p></section>
<section class="card">
<label for="prompt">What should the video teach?</label>
<textarea id="prompt" placeholder="Example: Teach kids the numbers 1 to 5 using cute animals, cheerful narration, and colorful objects.">Teach kids the numbers 1 to 5 using cute animals, cheerful narration, and colorful objects.</textarea>
<div class="grid">
<div><label for="age">Age</label><select id="age"><option>3-5</option><option selected>6-8</option><option>9-12</option></select></div>
<div><label for="length">Length</label><select id="length"><option value="30">30 seconds</option><option value="60">60 seconds</option><option value="120">2 minutes</option></select></div>
<div><label for="style">Visual style</label><select id="style"><option>cute 2D cartoon</option><option>bright 3D cartoon</option><option>storybook animation</option></select></div>
</div>
<button class="btn" id="create">✨ CREATE REAL AI VIDEO</button>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="status" id="status">Checking the video server…</div>
<div class="diag" id="diag" hidden></div>
</section>
<section class="card" id="result" hidden>
<h2>Your video</h2><div class="videoBox"><video id="video" controls playsinline></video><br><a id="download" class="download" download="kids-ai-video.mp4">⬇ Download MP4</a></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
async function health(){
 try{const r=await fetch("/api/health");const d=await r.json();
  if(!d.configured){$("status").textContent="Server is running, but the OpenAI API key is not configured.";return}
  $("status").textContent="Ready. Your prompt will be sent to the secure server.";
 }catch(e){$("status").textContent="Server not reachable. Start the Node server and open its http:// address, not the HTML file directly."; $("diag").hidden=false;$("diag").textContent="Connection error: "+e.message}
}
health();
$("create").onclick=async()=>{
 $("create").disabled=true;$("result").hidden=true;$("diag").hidden=true;$("fill").style.width="3%";
 $("status").textContent="Starting…";
 try{
  const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   prompt:$("prompt").value,age:$("age").value,length:Number($("length").value),style:$("style").value
  })});
  const d=await r.json(); if(!r.ok) throw new Error(d.error||"Could not start generation.");
  const id=d.jobId;
  for(;;){
   await new Promise(r=>setTimeout(r,1800));
   const q=await fetch("/api/jobs/"+id);const j=await q.json();
   if(!q.ok) throw new Error(j.error||"Job lookup failed.");
   $("fill").style.width=Math.max(3,j.progress||0)+"%";$("status").textContent=j.message||j.status;
   if(j.status==="failed") throw new Error(j.message||"Generation failed.");
   if(j.status==="completed"){
     const src=j.videoUrl+"?t="+Date.now();$("video").src=src;$("download").href=src;$("result").hidden=false;$("status").textContent="Done! Your real AI video is ready.";
     break;
   }
  }
 }catch(e){$("status").textContent="Generation stopped.";$("diag").hidden=false;$("diag").textContent=e.message+"\n\nIf this says 'Failed to fetch', you opened the HTML file directly. Start the server and open the http://localhost:3000 address instead."}
 $("create").disabled=false;
};
</script>
</body></html>
